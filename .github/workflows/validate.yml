name: Validate

on:
  push:
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" -r requirements-test.txt
          python -m pip install "ruff==0.16.5"

      - name: Run bridge and app tests
        run: python -m pytest -q ino_a9_bridge/tests -p no:homeassistant -p no:socket

      - name: Run integration tests
        run: python -m pytest -q tests

      - name: Check integration lint
        run: ruff check custom_components tests

      - name: Check integration formatting
        run: ruff format --check custom_components tests

  metadata:
    name: Validate app and integration metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install "PyYAML==6.0.3"

      - name: Validate manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml

          app = yaml.safe_load(Path("ino_a9_bridge/config.yaml").read_text())
          integration = json.loads(
              Path("custom_components/ino_a9/manifest.json").read_text()
          )
          assert app["slug"] == "ino_a9_bridge"
          assert app["arch"] == ["amd64", "aarch64"]
          assert app["discovery"] == ["ino_a9"]
          assert integration["domain"] == "ino_a9"
          assert integration["config_flow"] is True
          assert Path("hacs.json").is_file()
          PY

  hassfest:
    name: Home Assistant manifest validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
