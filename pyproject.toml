[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ino-a9-local-bridge"
version = "0.4.2"
description = "Local-only PPRPC research and bridge tooling for INO A9 cameras"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "0BSD"}
authors = [{name = "Ivan"}]
dependencies = ["cryptography>=48.0.0,<51.0.0"]

[project.optional-dependencies]
test = ["pytest==9.0.3", "pytest-asyncio==1.3.0", "PyYAML==6.0.3"]

[project.scripts]
wificam-pprpc = "wificam_bridge.cli:main"
wificam-bridge = "wificam_bridge.bridge:main"

[tool.hatch.build.targets.wheel]
packages = ["ino_a9_bridge/src/wificam_bridge"]

[tool.pytest.ini_options]
testpaths = ["ino_a9_bridge/tests"]
pythonpath = ["ino_a9_bridge/src"]
asyncio_mode = "auto"
